<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 10v6M2 10l10-5 10 5-10 5z'/><path d='M6 12v5c3 3 9 3 12 0v-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saanvika Software Solutions | Hiring & Examination Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const removeNetlifyBadge = () => {
          const badge =
            document.getElementById('nl-badge-frame') ||
            document.getElementById('nl-hud-frame') ||
            document.querySelector('iframe[title*="Netlify"]');
          if (badge) {
            badge.remove();
          }
        };
        const observer = new MutationObserver(removeNetlifyBadge);
        if (document.documentElement) {
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        window.addEventListener('load', removeNetlifyBadge);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
